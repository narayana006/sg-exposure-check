[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sg-exposure-check"
dynamic = ["version"]
description = "Find AWS security groups that expose sensitive ports to the internet, and show which instances, load balancers and databases they actually reach."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Narayana Vemburaj" }]
requires-python = ">=3.10"
dependencies = ["boto3>=1.26", "PyYAML>=6.0"]
keywords = [
    "aws",
    "security",
    "security-groups",
    "ec2",
    "vpc",
    "cloud-security",
    "audit",
    "boto3",
    "devsecops",
    "sre",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=7", "moto[ec2]>=5.0", "build>=1.2", "twine>=5.0"]

[project.scripts]
sg-exposure-check = "sg_exposure_check.cli:main"

[project.urls]
Homepage = "https://github.com/narayana006/sg-exposure-check"
Source = "https://github.com/narayana006/sg-exposure-check"
Issues = "https://github.com/narayana006/sg-exposure-check/issues"
Changelog = "https://github.com/narayana006/sg-exposure-check/releases"

[tool.setuptools.dynamic]
version = { attr = "sg_exposure_check.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
