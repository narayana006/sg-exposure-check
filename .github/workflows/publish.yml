name: Publish to PyPI

# Publishes when you push a version tag, e.g. git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches __version__
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(grep -Po '(?<=^__version__ = ")[^"]+' src/sg_exposure_check/__init__.py)
          echo "tag=$tag package=$pkg"
          test "$tag" = "$pkg" || { echo "::error::tag $tag != __version__ $pkg"; exit 1; }

      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing; no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
